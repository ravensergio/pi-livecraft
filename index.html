<!DOCTYPE html>
<html lang="fr">
  <head>
    <script>
    // Helium (Chromium fork) injects the React DevTools hook with isDisabled=true
    // as soon as it sees a module script, which makes Vite disable Fast Refresh.
    // Clear that shim so the dev server installs its own working hook. No-op in
    // other browsers and irrelevant in production builds.
    if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__?.isDisabled === true)
      delete window.__REACT_DEVTOOLS_GLOBAL_HOOK__

    // crypto.randomUUID only exists in secure contexts (HTTPS or localhost).
    // Over plain-HTTP LAN/VPN addresses (http://192.168.x.y) it is undefined,
    // which crashed message sending — provide a spec-shaped v4 fallback.
    if (!crypto.randomUUID) {
      crypto.randomUUID = function() {
        const bytes = crypto.getRandomValues(new Uint8Array(16))
        bytes[6] = (bytes[6] & 0x0f) | 0x40
        bytes[8] = (bytes[8] & 0x3f) | 0x80
        const hex = Array
          .from(bytes, (b) => b.toString(16).padStart(2, '0'))
          .join('')
        return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${
          hex.slice(16, 20)
        }-${hex.slice(20)}`
      }
    }
    </script>
    <script>
    !function() {
      var t = localStorage.getItem('pi-livecraft.theme')
      t && (document.documentElement.dataset.theme = t)
    }()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interface web locale pour piloter des sessions Pi."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pi Livecraft</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Studio cost overlay (ported from Tampermonkey); remove this tag to disable -->
    <script src="/cost-overlay.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
